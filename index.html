<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6ed">
  <meta name="description" content="Harfia: een vrolijk Arabisch leerspel met levels voor kinderen van 3 tot 10 jaar.">
  <title>Harfia ✦ Arabisch avontuur</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231f7974'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle' fill='white'%3E%D8%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="Terug naar de werelden"><span class="brand-mark">ب</span><span>harfia<span class="brand-spark">✦</span></span></button>
      <div class="topbar-right">
        <span class="pill age-tag" id="age-tag">Arabisch avontuur</span>
        <span class="pill stars-counter" id="stars-counter" aria-live="polite">⭐ 0</span>
        <button class="icon-btn" type="button" data-action="settings" title="Instellingen" aria-label="Instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.07.07-2.3 2.3-.07-.07a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.99 1.48V21h-3.3v-.77a1.6 1.6 0 0 0-.99-1.48 1.6 1.6 0 0 0-1.77.32l-.07.07-2.3-2.3.07-.07A1.6 1.6 0 0 0 6.6 15a1.6 1.6 0 0 0-1.48-.99H4v-3.3h1.12A1.6 1.6 0 0 0 6.6 9.7a1.6 1.6 0 0 0-.32-1.77l-.07-.07 2.3-2.3.07.07a1.6 1.6 0 0 0 1.77.32 1.6 1.6 0 0 0 .99-1.48V4h3.3v.47a1.6 1.6 0 0 0 .99 1.48 1.6 1.6 0 0 0 1.77-.32l.07-.07 2.3 2.3-.07.07a1.6 1.6 0 0 0-.32 1.77 1.6 1.6 0 0 0 1.48.99H21v3.3h-.12a1.6 1.6 0 0 0-1.48 1.01Z"/></svg></button>
      </div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span>Gemaakt om spelenderwijs te leren <span aria-hidden="true">💛</span></span><button type="button" data-action="parent">Voor ouders</button></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="confetti" class="confetti" aria-hidden="true"></div>
</body>
</html>
