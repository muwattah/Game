argin:12px 0}.card .cardlink{display:inline-flex;background:#fff2;border:1px solid #fff4;border-radius:99px;padding:8px 13px;font-weight:900}.card[data-s="begin"]{background:linear-gradient(145deg,#156f83,#12375d)}.card[data-s="know"]{background:linear-gradient(145deg,#7452a4,#2a3e83)}.card[data-s="read"]{background:linear-gradient(145deg,#986144,#573565)}.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.world{border:2px solid #ffffff2e;border-radius:28px;background:#ffffff12;overflow:hidden}.world-top{display:flex;align-items:center;gap:18px;padding:21px 22px}.world-icon{font-size:3.3rem;background:#ffffff1a;border-radius:24px;width:92px;height:86px;display:grid;place-items:center;flex-shrink:0}.world h3{margin:0 0 4px}.world p{color:#d1e2fc;font-size:.92rem;margin:0}.world-meta{margin-left:auto;font-weight:900;color:var(--gold);white-space:nowrap}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;padding:0 21px 21px}.level{border:2px solid #ffffff35;border-radius:17px;background:#ffffff1a;color:#fff;min-height:59px;font-size:1.15rem;font-weight:1000}.level span{display:block;font-size:.73rem;white-space:nowrap}.level.unlocked{background:#fddd65;color:#523c12;border-color:#fff7c0}.level.completed{background:#67dcaf;color:#064b40;border-color:#b8ffe0}.level:disabled{opacity:.36;cursor:not-allowed}.info{color:#c7d9f0;line-height:1.6}.footnote{padding:20px 0;color:#d6e3efbf;font-size:.9rem}.game{position:relative;width:100%;height:100svh;min-height:520px;background:#5b8bc7;overflow:hidden;touch-action:none;user-select:none}#track{width:100%;height:100%;display:block}.game-hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:env(safe-area-inset-top,12px) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.hud-item{pointer-even er{display:flex;gap:5px}.dot{width:17px;height:17px;border-radius:50%;border:2px solid #fff;background:#fff6}.dot.on{background:#ffdf4d}.pause-shade{position:absolute;inset:0;background:#0b1a42bd;backdrop-filter:blur(7px);display:grid;place-items:center;padding:25px;z-index:20}.modal{width:min(490px,100%);background:#fffefa;color:#162957;text-align:center;border-radius:35px;border:6px solid #f6ca55;padding:28px 24px;box-shadow:0 26px 75px #09173d92}.modal .bigicon{font-size:5rem}.modal p{line-height:1.6;color:#4a5978}.modal .secondary{color:#224270;background:#e6f2ff;border-color:#c4ddfc}.modal .buttons{display:flex;justify-content:center;gap:11px;flex-wrap:wrap}.endstars{font-size:2.8rem;letter-spacing:6px;margin:14px}.win-details{font-size:1.2rem;font-weight:900;color:#174c69}.soundstatus{font-size:.77rem!important;color:#627293!important}.game .center-help{position:absolute;top:59%;left:50%;transform:translateX(-50%);font-size:.84rem;background:#1d3c76b0;border-radius:99px;padding:7px 11px;white-space:nowrap;pointer-events:none}.sr{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}@keyframes bob{0%,100%{transform:translateY(-8px)}50%{transform:translateY(12px)}}@keyframes pop{from{opacity:.3;transform:translateX(-50%) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center;gap:0}.hero h1{font-size:3.4rem}.hero p{margin:auto}.hero-buttons,.tagline{justify-content:center}.hero-art{min-height:260px;order:-1}.hero-art .planet{width:250px}.hero-art .mascot{font-size:8rem}.hero-art .float{font-size:2.4rem}.stages{grid-template-columns:1fr}.card{min-height:182px}.card .emoji{font-size:2.5rem;margin-bottom:5px}.map-grid{grid-template-columns:1fr}.world-top{gap:13px}.world-icon{width:63px;height:65px;font-size:2.4rem}.world-meta{font-size:.9rem}.wrap{padding:14px 13px 50px}.nav{margin:10px 0 25px}.nav-actions{gap:6px}.nav .pill{font-size:.8rem;padding:8px}.hud-center{top:13%}. <body>
<main id="app" aria-live="polite"></main>
<script>
/* Harfia Rush — browser-only educational runner. No ads, analytics or accounts. */
'use strict';
const LETTERS=[
['ا','أَلِف','alif'],['ب','بَاء','baa'],['ت','تَاء','taa'],['ث','ثَاء','thaa'],['ج','جِيم','jiim'],['ح','حَاء','haa'],['خ','خَاء','khaa'],
['د','دَال','daal'],['ذ','ذَال','dhaal'],['ر','رَاء','raa'],['ز','زَاي','zaay'],['س','سِين','siin'],['ش','شِين','shiin'],['ص','صَاد','saad'],
['ض','ضَاد','daad'],['ط','طَاء','taa zwaar'],['ظ','ظَاء','dhaa zwaar'],['ع','عَيْن','ayn'],['غ','غَيْن','ghayn'],['ف','فَاء','faa'],['ق','قَاف','qaaf'],
['ك','كَاف','kaaf'],['ل','لَام','laam'],['م','مِيم','miim'],['ن','نُون','nuun'],['ه','هَاء','haa licht'],['و','وَاو','waaw'],['ي','يَاء','yaa']
].map(([ar,spoken,nl],i)=>({id:'l'+i,ar,spoken,nl}));
const WORDS=[
['قِطَّة','kat','🐱'],['كَلْب','hond','🐶'],['أَسَد','leeuw','🦁'],['سَمَكَة','vis','🐟'],['طَائِر','vogel','🐦'],['تُفَّاحَة','appel','🍎'],
['مَوْز','banaan','🍌'],['شَمْس','zon','☀️'],['قَمَر','maan','🌙'],['بَيْت','huis','🏠'],['كِتَاب','boek','📖'],['مَاء','water','💧']
].map(([ar,nl,emoji],i)=>({id:'w'+i,ar,spoken:ar,nl,emoji}));
const DIGITS=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'].map((ar,i)=>({id:'n'+i,ar,spoken:['صِفْر','وَاحِد','اِثْنَان','ثَلَاثَة','أَرْبَعَة','خَمْسَة','سِتَّة','سَبْعَة','ثَمَانِيَة','تِسْعَة'][i],nl:String(i)}));
const VOWELS=[['بَ','بَ','ba'],['بِ','بِ','bi'],['بُ','بُ','bu'],['تَ','تَ','ta'],['تِ','تِ','ti'],['تُ','تُ','tu'],['مَ','مَ','ma'],['مِ','مِ','mi'],['مُ','مُ','mu']].map(([ar,spoken,nl],i)=>({id:'v'+i,ar,spoken,nl}));
const PHRASES=[['مَرْحَبًا','hallo','👋'],['شُكْرًا','dank je','💝'],['نَعَمْ','ja','✅'],['لَا','nee','🙅'],['صَبَاحُ الْخَيْر','goedemorgen','🌅'],['إِلَى اللِّقَاء','tot ziens','👋']].map(([ar,nl,emoji],i)=>({id:'p'+i,ar,spoken:ar,nl,emoji}));
const FORMBASE=[['ب','بـ','ـبـ','ـب'],['ت','تـ','ـتـ','ـت'],['ث','ثـ','ـثـ','ـث'],['ج','جـ','ـجـ','ـج'],['ح','حـ','ـحـ','ـح'],['خ','خـ','ـخـ','ـخ'],['س','سـ','ـسـ','ـس'],['ش','شـ','ـشـ','ـش'],['ص','صـ','ـصـ','ـص'],['ض','ضـ','ـضـ','ـض'],['ع','عـ','ـعـ','ـع'],['غ','غـ','ـغـ','ـغ'],['ف','فـ','ـفـ','ـف'],['م','مـ','ـمـ','ـم']].map(([ar,initial,middle,end],i)=>({id:'f'+i,ar,spoken:ar,forms:[initial,middle,end]}));
const STAGES=[
{id:'begin',icon:'🐣',name:'Ik begin net',short:'Ik ontdek letters',desc:'Je hoeft nog niets te weten. Kijk, luister en pak dezelfde letter!',hint:'Zoek dezelfde letter',color:'#48d4d2'},
{id:'know',icon:'🦊',name:'Ik herken al iets',short:'Ik ken letters',desc:'Ik herken sommige letters en ontdek woordjes, plaatjes en cijfers.',hint:'Pak het goede antwoord',color:'#bd99ff'},
{id:'read',icon:'🚀',name:'Ik lees al wat',short:'Ik lees woordjes',desc:'Ik leer zinnetjes en hoe een letter eruitziet in een woord.',hint:'Pak het goede antwoord',color:'#ffb978'}
];
const WORLDS=[
{id:'forest',stage:'begin',icon:'🌳',name:'Letterbos',subtitle:'De eerste zeven letters',color:'#52dfab',type:'letter',items:LETTERS.slice(0,7)},
{id:'desert',stage:'begin',icon:'🏜️',name:'Zandzee',subtitle:'Nog zeven letters',color:'#ffd16d',type:'letter',items:LETTERS.slice(7,14)},
{id:'clouds',stage:'begin',icon:'☁️',name:'Wolkeneiland',subtitle:'Verder op avontuur',color:'#81deff',type:'letter',items:LETTERS.slice(14,21)},
{id:'stars',stage:'begin',icon:'🌟',name:'Sterrenstad',subtitle:'Alle 28 letters!',color:'#ff96cd',type:'letter',items:LETTERS.slice(21,28)},
{id:'animals',stage:'know',icon:'🐱',name:'Plaatjesland',subtitle:'Dieren, eten en meer',color:'#5de2a5',type:'word',items:WORDS},
{id:'numbers',stage:'know',icon:'🔢',name:'Cijferbaan',subtitle:'Tel van 0 tot 9',color:'#9eb7ff',type:'digit',items:DIGITS},
{id:'marks',stage:'know',icon:'🎵',name:'Tekenrace',subtitle:'Letters met kleine tekens',color:'#ffba71',type:'vowel',items:VOWELS},
{id:'talk',stage:'read',icon:'💬',name:'Praatplaneet',subtitle:'Hallo, dank je, tot ziens',color:'#a3f1d3',type:'phrase',items:PHRASES},
{id:'join',stage:'read',icon:'🧩',name:'Letterpuzzel',subtitle:'Letters zien er soms anders uit',color:'#e6b0f6',type:'form',items:FORMBASE}
];
const APP=document.getElementById('app');const STORE_KEY='harfia-rush-v2';
function loadProgress(){try{const p=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');return{stage:p.stage||'begin',completed:p.completed||{},sound:p.sound!==false,avatar:p.avatar||'🦊',coins:p.coins||0}}catch{return{stage:'begin',completed:{},sound:true,avatar:'🦊',coins:0}}}
let saved=loadProgress();let state={screen:'home',world:null,level:0,session:null};let raf=0;let lastT=0;let keyboardBound=false;let audioContext=null;let voices=[];
function store(){try{localStorage.setItem(STORE_KEY,JSON.stringify(saved))}catch{}}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function btn(text,fn,clazz='secondary'){return `<button class="${clazz}" data-action="${fn}">${text}</button>`}
function nav(title){return `<div class="nav"><div class="brand">✨ Harfia <em>RUSH</em></div><div class="nav-actions"><span class="pill">⭐ ${saved.coins}</span>${btn(saved.sound?'🔊 Geluid':'🔇 Geluid','sound','pill')}${title?btn('⌂ Start','home','pill'):''}</div></div>`}
function selectScreen(s){stopRunner();state.screen=s;render();window.scrollTo(0,0)}
function render(){if(state.screen==='home')return renderHome();if(state.screen==='map')return renderMap();if(state.screen==='run')return renderRun();if(state.screen==='win')return renderWin();}
function renderHome(){APP.innerHTML=`<div class="shell"><div class="wrap">${nav(false)}<div class="hero"><div><div class="eyebrow">🎮 Een écht renspel om Arabisch te leren</div><h1>Ren. Spring.<br><strong>Leer Arabisch!</strong></h1><p>Ren met je vriendje over de baan, spring over blokken, verzamel sterren en pak de juiste Arabische letters of woorden. Iedere goede keuze brengt je verder!</p><div class="hero-buttons">${btn('🏃 SPELEN!','stage','primary')}${btn('🎙️ Luister naar Arabisch','demo')}</div><div class="tagline"><span class="tag">🕹️ Echt bewegen</span><span class="tag">⭐ Beloningen</span><span class="tag">🔊 Arabische uitspraak</span><span class="tag">📱 Ook op telefoon</span></div></div><div class="hero-art"><div class="planet"></div><div class="mascot">${saved.avatar}</div><span class="float f1">ب</span><span class="float f2">م</span><span class="float f3">⭐ × 10</span></div></div><div class="section-heading"><div><h2>Wat kan jij al?</h2><p>Geen leeftijden. Kies wat jij zelf al kent.</p></div></div><div class="stages">${STAGES.map(s=>`<button class="card" data-action="choose" data-id="${s.id}" data-s="${s.id}"><span class="emoji">${s.icon}</span><span class="name">${s.name}</span><span class="small">${s.desc}</span><span class="cardlink">Spelen →</span></button>`).join('')}</div><p class="footnote">Voor ouders: speelt zonder advertenties of accounts. De uitspraak werkt via de Arabische computerstem van je apparaat en is niet gegarandeerd een opgenomen kinderstem.</p></div></div>`}
function worldUnlocked(world){const siblings=WORLDS.filter(w=>w.stage===world.stage);const idx=siblings.findIndex(w=>w.id===world.id);if(idx===0)return true;const prev=siblings[idx-1];return prev.items.every((_,i)=>saved.completed[`${prev.id}:${i}`]);}
function levelUnlocked(world,index){return index===0||!!saved.completed[`${world.id}:${index-1}`]}

function makeQuestion(world,level,round){const unlocked=world.items.slice(0,level+1);const focus=world.items[level];const item=(round===0||round%3===1||unlocked.length===1)?focus:unlocked[Math.floor(Math.random()*unlocked.length)];let prompt,display,spoken,options;

else if(world.type==='digit'){prompt='Zoek dit cijfer!';display=item.nl;spoken=item.spoken;options=world.items.map(o=>({label:o.ar,key:o.id}))}

else {prompt='Zoek deze letter aan het begin!';display=item.ar;spoken=item.spoken;options=world.items.map(o=>({label:o.forms[0],key:o.id}))}
const remaining=shuffled(options.filter(o=>o.key!==item.id));const correct=options.find(o=>o.key===item.id);const choices=shuffled([correct,...remaining.slice(0,2)]);return{item,prompt,display,spoken,choices,correct:item.id,type:world.type}}
function playSound(kind){if(!saved.sound)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;o.connect(g);g.connect(audioContext.destination);o.type=kind==='bad'?'triangle':'sine';const hz=kind==='bad'?220:kind==='coin'?840:620;o.frequency.setValueAtTime(hz,t);o.frequency.exponentialRampToValueAtTime(kind==='bad'?185:hz*1.3,t+.14);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.start(t);o.stop(t+.24)}catch{}}

function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
function renderWin(){const g=state.session;if(!g)return;let next=g.level+1;let nextWorld=g.world;const siblings=WORLDS.filter(w=>w.stage===g.world.stage);if(next>=g.world.items.length){const wi=siblings.findIndex(w=>w.id===g.world.id);nextWorld=siblings[wi+1]||null;next=0}const unlockedNext=!!nextWorld&&worldUnlocked(nextWorld)&&levelUnlocked(nextWorld,next);APP.innerHTML=`<div class="shell"><div class="wrap">${nav(true)}<div style="display:grid;min-height:78svh;place-items:center"><div class="modal" style="max-width:560px"><div class="bigicon">🏆</div><h2>Jaaa, je hebt het gehaald!</h2><div class="endstars">⭐ 🌟 ⭐</div><p class="win-details">Je pakte ${g.hits} goede poorten!</p><p>Je verdiende <strong>${g.coins} sterren</strong>. Je hebt ${esc(g.question.item.ar)} onderweg leren herkennen. Goed gedaan!</p><div class="buttons">${unlockedNext?`<button class="primary" data-action="play" data-world="${nextWorld.id}" data-level="${next}">🏃 Volgende baan →</button>`:''}${btn('🗺️ Kies een baan','map')}${btn('🔁 Nog eens','again')}</div></div></div></div></div>`}
function handleAction(action,data){switch(action){case'home':selectScreen('home');break;case'stage':selectScreen('home');setTimeout(()=>document.querySelector('.stages')?.scrollIntoView({behavior:'smooth',block:'center'}),25);break;case'choose':{if(!STAGES.some(s=>s.id===data.id))return;saved.stage=data.id;store();selectScreen('map');break}case'map':selectScreen('map');break;case'play':startRun(data.world,data.level);break;case'again':startRun(state.world.id,state.level);break;case'resume':beginMovement();break;case'pause':pauseRunner();break;case'left':goLane(state.session.desiredLane-1);break;case'right':goLane(state.session.desiredLane+1);break;case'jump':jump();break;case'slide':slide();break;case'hear':speak(state.session?.question.spoken||'مَرْحَبًا');break;case'demo':speak('مَرْحَبًا! أَهْلًا وَسَهْلًا');break;case'sound':saved.sound=!saved.sound;store();if(!saved.sound)try{window.speechSynthesis?.cancel()}catch{}if(state.screen==='run'){const btn=document.querySelector('[data-action="sound"]');if(btn)btn.textContent=saved.sound?'🔊 Geluid':'🔇 Geluid';}else render();break;}}
APP.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;handleAction(el.dataset.action,el.dataset)});
window.addEventListener('keydown',e=>{if(state.screen!=='run')return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','a','d','w','s','Escape'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')goLane(state.session.desiredLane-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')goLane(state.session.desiredLane+1);if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w')jump();if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')slide();if(e.key==='Escape'&&!state.session.paused)pauseRunner()});
APP.addEventListener('pointerdown',e=>{if(state.screen!=='run'||!e.target.closest('#track'))return;state.session.pointerStart={x:e.clientX,y:e.clientY};});
APP.addEventListener('pointerup',e=>{if(state.screen!=='run'||!e.target.closest('#track'))return;const g=state.session,p=g.pointerStart;if(!p||g.paused)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;if(Math.abs(dx)>35||Math.abs(dy)>35){if(Math.abs(dx)>Math.abs(dy))goLane(g.desiredLane+(dx>0?1:-1));else if(dy<0)jump();else slide()}else{const rect=g.canvas.getBoundingClientRect(),x=e.clientX-rect.left;goLane(x<rect.width/3?0:x<rect.width*2/3?1:2)}g.pointerStart=null});
window.addEventListener('resize',()=>{if(state.screen==='run'){resize();paint()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.screen==='run'&&!state.session.paused)pauseRunner()});
render();

</script>
</body></html>
